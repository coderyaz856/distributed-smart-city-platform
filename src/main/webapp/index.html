<!-- src/main/webapp/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart City Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .new-item { animation: highlight 3s ease-in-out; }
    @keyframes highlight { from { background: rgba(255,255,0,0.5) } to { background: transparent } }
    .realtime-badge { position:absolute; top:-5px; right:-5px; background:red; width:10px; height:10px; border-radius:50%; animation:pulse 1.5s infinite; }
    @keyframes pulse {0%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:0.7;}100%{transform:scale(1);opacity:1;}}
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand">Smart City Dashboard</a></div></nav>
  <div class="container mt-4">
    <div class="row">
      <!-- Charts column -->
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs" id="resource-tabs" role="tablist">
              <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#water">Water</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#energy">Energy</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#waste">Waste</button></li>
              <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#traffic">Traffic</button></li>
            </ul>
          </div>
          <div class="card-body">
            <div class="tab-content">
              <div class="tab-pane fade show active" id="water"><canvas id="water-chart" height="200"></canvas></div>
              <div class="tab-pane fade" id="energy"><canvas id="energy-chart" height="200"></canvas></div>
              <div class="tab-pane fade" id="waste"><canvas id="waste-chart" height="200"></canvas></div>
              <div class="tab-pane fade" id="traffic"><canvas id="traffic-chart" height="200"></canvas></div>
            </div>
          </div>
        </div>
      </div>
      <!-- Alerts & Recommendations column -->
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header"><h5>Active Alerts</h5></div>
          <div class="card-body alert-card" id="alerts-container"></div>
        </div>
        <div class="card">
          <div class="card-header"><h5>Recommendations</h5></div>
          <div class="card-body" id="recommendations-container"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const charts = {}, resourceData = {
      water: {datasets:[{borderColor:'blue',tension:0.1}], labels:[]},
      energy:{datasets:[{borderColor:'orange',tension:0.1}], labels:[]},
      waste :{datasets:[{borderColor:'brown',tension:0.1}], labels:[]},
      traffic:{datasets:[{borderColor:'red',tension:0.1}], labels:[]}
    };
    
    document.addEventListener('DOMContentLoaded', () => {
      ['water','energy','waste','traffic'].forEach(r => {
        const ctx = document.getElementById(r+'-chart').getContext('2d');
        charts[r] = new Chart(ctx,{type:'line',data:resourceData[r],options:{responsive:true,maintainAspectRatio:false}});
      });
      fetchInitialData();
      connectWebSocket();
    });

    function fetchInitialData(){
      ['water','energy','waste','traffic'].forEach(r=>{
        fetch(`/api/dashboard/sensors/${r}`)
          .then(res=>res.ok?res.json():[]).then(d=>updateChart(r,d));
        fetch(`/api/dashboard/alerts/${r}`)
          .then(res=>res.ok?res.json():[]).then(a=>updateAlerts(a));
        fetch(`/api/dashboard/recommendations/${r}`)
          .then(res=>res.ok?res.json():[]).then(rm=>updateRecommendations(rm));
      });
    }

    function connectWebSocket(){
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const endpoint = window.SMARTCITY_WEBSOCKET_URL || `${scheme}://${location.hostname}:8081/ws`;
      const socket = new WebSocket(endpoint);
      socket.onopen    = ()=>console.log('WS connected');
      socket.onmessage = e => {
        const msg = JSON.parse(e.data);
        switch(msg.type){
          case 'sensorData':      updateChart(msg.resourceType,[msg.payload]); break;
          case 'alert':           updateAlerts([msg.payload]);              break;
          case 'recommendation':  updateRecommendations([msg.payload]);     break;
        }
      };
      socket.onclose   = ()=>console.warn('WS closed');
      socket.onerror   = err=>{console.error('WS error',err); fetchInitialData();};
    }

    function formatTime(ts){
      const d=new Date(ts); return `${d.getHours()}:${d.getMinutes()}:${d.getSeconds()}`;
    }

    function updateChart(resourceType, readings){
      if(!readings.length||!charts[resourceType]) return;
      const sorted=readings.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
      charts[resourceType].data.labels = sorted.map(r=>formatTime(r.timestamp));
      charts[resourceType].data.datasets = [{
        label: `${sorted[0].type} (${sorted[0].unit})`,
        data: sorted.map(r=>r.value),
        borderColor: charts[resourceType].data.datasets[0]?.borderColor,
        tension: 0.1,
        fill:false
      }];
      charts[resourceType].update();
    }

    function updateAlerts(alerts){
      const c=document.getElementById('alerts-container');
      alerts.forEach(a=>{
        if(c.querySelector(`[data-alert-id="${a.id}"]`)) return;
        const div=document.createElement('div');
        div.className=`alert alert-${a.severity.toLowerCase()} new-item`;
        div.dataset.alertId=a.id;
        div.innerHTML=`
          <div class="realtime-badge"></div>
          <strong>${a.sensorType} Alert:</strong> ${a.message}
          <button class="btn btn-sm btn-outline-dark float-end">Ack</button>`;
        div.querySelector('button').onclick = ()=>{
          fetch(`/api/dashboard/alerts/${a.id}/acknowledge`,{method:'POST'})
            .then(r=>r.ok&&div.remove());
        };
        c.prepend(div);
      });
    }

    function updateRecommendations(recs){
      const c=document.getElementById('recommendations-container');
      recs.forEach(r=>{
        if(c.querySelector(`[data-rec-id="${r.id}"]`)) return;
        const div=document.createElement('div');
        div.className='card mb-2 new-item';
        div.dataset.recId=r.id;
        div.innerHTML=`
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">${r.resource} Optimization</h6>
            <p class="card-text">${r.action}</p>
            <small class="text-muted">Savings: ${r.expectedSavings} ${r.savingsUnit}</small>
            <button class="btn btn-sm btn-success">Implement</button>
          </div>`;
        div.querySelector('button').onclick = ()=>{
          fetch(`/api/dashboard/recommendations/${r.id}/implement`,{method:'POST'})
            .then(x=>x.ok&&div.remove());
        };
        c.prepend(div);
      });
    }
  </script>
</body>
</html>
